name: Обновить каталог

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python refresh_catalog.py
      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json
          if [ -f data/changelog.json ]; then
            git add data/changelog.json data/changelog.txt data/changelog.xlsx
          fi
          git diff --cached --quiet && echo "нет изменений" && exit 0
          git commit -m "Обновление каталога с Яндекс.Диска"
          git push
