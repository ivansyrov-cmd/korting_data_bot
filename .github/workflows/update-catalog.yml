name: Обновить каталог

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python refresh_catalog.py
      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json
          if [ -f data/changelog.json ]; then
            git add data/changelog.json data/changelog.txt
            git add -f data/changelog.xlsx
          fi
          if [ -f korting_bot/changelog.json ]; then
            git add korting_bot/changelog.json
          fi
          if [ -f docs/index.html ]; then
            git add docs/index.html
          fi
          if [ -f docs/izmeneniya_ttx.xlsx ]; then
            git add docs/izmeneniya_ttx.xlsx
          fi
          git diff --cached --quiet && echo "нет изменений" && exit 0
          git commit -m "Обновление каталога с Яндекс.Диска"
          git push
